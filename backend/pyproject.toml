[project]
name = "tokenledger"
version = "0.2.0"
description = "Append-only ledger of AI token usage and estimated cost"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=2.2,<3",
    "tzlocal>=5.2",
    "tzdata>=2025.2",
    "psutil>=6",
    "zstandard>=0.23",
]

[project.scripts]
tokenledger = "tokenledger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "cryptography>=43",  # tests/test_cloud.py signs passkey responses
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
